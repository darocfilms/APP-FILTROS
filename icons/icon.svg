<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Laboratorio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d22"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="emulsion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b34a"/>
      <stop offset="0.5" stop-color="#e06a4a"/>
      <stop offset="1" stop-color="#4a7fe8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- Perforaciones de película -->
  <g fill="#2c2f36">
    <rect x="74" y="150" width="34" height="212" rx="8"/>
    <rect x="404" y="150" width="34" height="212" rx="8"/>
  </g>
  <g fill="#08090b">
    <rect x="82" y="164" width="18" height="26" rx="5"/>
    <rect x="82" y="206" width="18" height="26" rx="5"/>
    <rect x="82" y="248" width="18" height="26" rx="5"/>
    <rect x="82" y="290" width="18" height="26" rx="5"/>
    <rect x="82" y="322" width="18" height="26" rx="5"/>
    <rect x="412" y="164" width="18" height="26" rx="5"/>
    <rect x="412" y="206" width="18" height="26" rx="5"/>
    <rect x="412" y="248" width="18" height="26" rx="5"/>
    <rect x="412" y="290" width="18" height="26" rx="5"/>
    <rect x="412" y="322" width="18" height="26" rx="5"/>
  </g>
  <!-- Fotograma con el degradado de la emulsión -->
  <rect x="128" y="150" width="256" height="212" rx="14" fill="url(#emulsion)"/>
  <!-- Objetivo -->
  <circle cx="256" cy="256" r="66" fill="#08090b" opacity="0.82"/>
  <circle cx="256" cy="256" r="66" fill="none" stroke="#f2f3f5" stroke-width="9" opacity="0.9"/>
  <circle cx="256" cy="256" r="27" fill="none" stroke="#f2f3f5" stroke-width="7" opacity="0.55"/>
</svg>
