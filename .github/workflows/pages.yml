# Publica la aplicación en GitHub Pages en cada empuje a main.
#
# Requiere activar Pages una sola vez: Settings → Pages → Source: "GitHub
# Actions". No se puede automatizar desde aquí: dar de alta el sitio necesita
# permiso de administración del repositorio, y el GITHUB_TOKEN del flujo no lo
# tiene ni se le puede conceder en el bloque `permissions` (`enablement: true`
# falla con "Resource not accessible by integration"). Una vez activado, cada
# empuje a main publica solo.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construir dist/
        run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
